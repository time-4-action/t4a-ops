# T4A Admin Dashboard
# Server path: /data/stack/apps/time-4-action/admin/
# Port: 3005
# Domain: admin.time-4-action.com
#
# Deployed by GitHub Actions from time-4-action/t4a-admin (docs/deployment.md):
# CI exports APP_IMAGE=ghcr.io/time-4-action/t4a-admin:<commit sha>; without it this runs
# :latest. The server never builds. Mirrors t4a-admin's deploy/docker-compose.yaml.

services:
  t4a-admin:
    image: ${APP_IMAGE:-ghcr.io/time-4-action/t4a-admin:latest}
    ports:
      - "3005:3005"
    env_file:
      - .env.local
    environment:
      PORT: 3005
      AUTH0_BASE_URL: ${AUTH0_BASE_URL:-https://admin.time-4-action.com}
    restart: unless-stopped
